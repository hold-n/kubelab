# A CustomResourceDefinition teaches the API server a new type: "Greeter".
# After applying it, `kubectl get greeters` works like any built-in resource.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greeters.kubelab.dev
spec:
  group: kubelab.dev
  scope: Namespaced
  names:
    kind: Greeter
    plural: greeters
    singular: greeter
    shortNames: [gr]
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [message]
              properties:
                message: { type: string }
                replicas: { type: integer, minimum: 1, maximum: 5, default: 1 }
      additionalPrinterColumns:
        - { name: Message, type: string, jsonPath: .spec.message }
        - { name: Replicas, type: integer, jsonPath: .spec.replicas }
