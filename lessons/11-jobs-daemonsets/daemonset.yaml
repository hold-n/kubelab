# A DaemonSet runs one copy of a pod on every (matching) node - the natural fit for
# node agents: log shippers (Fluent Bit), monitoring (node-exporter), CNI, CSI drivers.
# `kubectl get ds -n kube-system` shows the cluster's own: kube-proxy and kindnet.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      # The control-plane node is tainted so ordinary pods stay off it.
      # Node agents usually tolerate that taint so they run everywhere.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.37
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # hostPath gives access to the node's filesystem - here, its container logs
          command: ["sh", "-c", "while true; do echo \"$NODE_NAME: $(ls /var/log/pods | wc -l) pod log dirs\"; sleep 30; done"]
          volumeMounts:
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      volumes:
        - name: pod-logs
          hostPath:
            path: /var/log/pods
