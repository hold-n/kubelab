apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscale
spec:
  replicas: 1 # the HPA takes over this field once created
  selector:
    matchLabels:
      app: autoscale
  template:
    metadata:
      labels:
        app: autoscale
    spec:
      containers:
        - name: app
          image: kubelab/app:v1
          imagePullPolicy: Never
          resources:
            requests: { cpu: 100m, memory: 64Mi } # HPA utilisation % is relative to *requests*
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: autoscale
spec:
  selector:
    app: autoscale
  ports:
    - port: 80
      targetPort: 8080
