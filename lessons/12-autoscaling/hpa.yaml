# HorizontalPodAutoscaler: like an ASG target-tracking policy, for pods.
# Every ~15s it reads metrics (from metrics-server) and computes
#   desiredReplicas = ceil(currentReplicas * currentUtilisation / targetUtilisation)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoscale
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoscale
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30 # default is 300s; shortened so you can watch it in the lab
