# type: LoadBalancer asks the cloud provider for an external load balancer.
# On EKS the AWS Load Balancer Controller would create an NLB here;
# in this lab, cloud-provider-kind creates a container with a routable IP.
# (LoadBalancer is a superset of NodePort, which is a superset of ClusterIP.)
apiVersion: v1
kind: Service
metadata:
  name: web-public
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
