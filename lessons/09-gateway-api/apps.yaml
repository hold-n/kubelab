# Two versions of the app running side by side, each behind its own Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v1
spec:
  replicas: 2
  selector:
    matchLabels: { app: web, version: v1 }
  template:
    metadata:
      labels: { app: web, version: v1 }
    spec:
      containers:
        - name: app
          image: kubelab/app:v1
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: web-v1
spec:
  selector: { app: web, version: v1 }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-v2
spec:
  replicas: 2
  selector:
    matchLabels: { app: web, version: v2 }
  template:
    metadata:
      labels: { app: web, version: v2 }
    spec:
      containers:
        - name: app
          image: kubelab/app:v2
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: web-v2
spec:
  selector: { app: web, version: v2 }
  ports:
    - port: 80
      targetPort: 8080
