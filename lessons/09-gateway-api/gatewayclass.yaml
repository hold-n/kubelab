# GatewayClass: "which implementation?" (cluster-scoped, usually set up by the platform team).
# Comparable to choosing ALB vs NLB - here we choose Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
