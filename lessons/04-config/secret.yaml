# Secrets are like ConfigMaps but for sensitive data (think Secrets Manager).
# NOTE: values are only base64-encoded, not encrypted. Access is controlled with
# RBAC, and real clusters enable encryption at rest (EKS: envelope encryption with KMS)
# or sync from an external store (External Secrets Operator / Secrets Store CSI driver).
apiVersion: v1
kind: Secret
metadata:
  name: web-secret
type: Opaque
stringData: # plain text here; the API server stores it base64-encoded under .data
  API_TOKEN: "s3cr3t-token"
