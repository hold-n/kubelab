apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: capstone
  namespace: capstone
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: capstone
spec:
  parentRefs:
    - name: capstone
  rules:
    - backendRefs:
        - name: web
          port: 80
