# A 3-node local cluster: 1 control plane + 2 workers.
# Each "node" is a Docker container running kubelet + containerd.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
  - role: worker
    labels:
      zone: zone-a
  - role: worker
    labels:
      zone: zone-b
